name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-minimal:
    name: eval-minimal (TestClient, no Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install nallputer
        run: pip install -e ./nallputer

      - name: Install test deps
        run: pip install pytest httpx fastapi pydantic pydantic-settings python-multipart

      - name: Run minimal harness (19 tests)
        env:
          NALLPUTER_TOKEN: dev-token
          NALLPUTER_PROVIDER: ci
          PYTHONPATH: nallputer
        run: pytest tests -k "not linux" -v --junitxml=tests/results/junit.xml

      - name: Upload results-minimal
        uses: actions/upload-artifact@v4
        with:
          name: results-minimal
          path: |
            tests/results/*.json
            tests/results/REPORT.md
            tests/results/junit.xml
          if-no-files-found: error
          retention-days: 14

  eval-linux:
    name: eval-linux (Docker, cgroup v2)
    runs-on: ubuntu-latest
    needs: eval-minimal
    # Informational initially — not a required gate. Ordering via needs, but not blocking merge in branch protection.
    # Promote to required after first stable green baseline in tests/results/linux/REPORT.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Linux harness
        env:
          DOCKER_BUILDKIT: 1
        run: make eval-linux

      - name: Upload results-linux
        uses: actions/upload-artifact@v4
        with:
          name: results-linux
          path: |
            tests/results/linux/**
            tests/results/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize
        if: always()
        run: |
          echo "## Phase 7-full Linux evidence" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/results/linux/REPORT.md ]; then cat tests/results/linux/REPORT.md >> $GITHUB_STEP_SUMMARY; else echo "REPORT not yet generated — see pytest.log" >> $GITHUB_STEP_SUMMARY; fi
